<!-- Portadas de los casos de éxito para el carrusel del home (900x1200).
     Cada portada es un <div class="cv" data-c="N">; se ve una por vez con ?c=N.
     Para sumar un caso: copiar un .cv, cambiar data-c y el contenido.
     Render (Mac): firefox --headless --no-remote --profile <dir> --window-size=900,1200
       --screenshot out.png "http://localhost:4599/tools/portadas-casos.html?c=N"
     y pasar a jpg: sips -s format jpeg -s formatOptions 84 out.png --out assets/images/casos/<caso>.jpg --><html><head><meta charset="utf-8">

*{box-sizing:border-box;margin:0}
html,body{width:900px;height:1200px;overflow:hidden;background:#07090c;font-family:Figtree,sans-serif;color:#fff}
.cv{position:relative;width:900px;height:1200px;overflow:hidden;
 background:radial-gradient(600px 480px at 18% 18%,rgba(242,128,30,.30),transparent 70%),
 radial-gradient(640px 520px at 88% 42%,rgba(34,211,238,.22),transparent 70%),#0a0e13}
.cv:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:60px 60px;-webkit-mask-image:radial-gradient(ellipse at 50% 35%,#000 20%,transparent 75%)}
.stage{position:absolute;left:0;right:0;top:130px;height:560px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:48px}
.row{display:flex;align-items:center;gap:22px}
.tile{border-radius:34px;box-shadow:0 30px 60px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.12)}
.dim{filter:grayscale(1) brightness(.6)}
.glow-c{box-shadow:0 0 90px rgba(34,211,238,.45),0 30px 60px rgba(0,0,0,.55)}
.glow-g{box-shadow:0 0 90px rgba(37,211,102,.4),0 30px 60px rgba(0,0,0,.55)}
.tn{display:inline-flex;align-items:center;justify-content:center;background:#fff;border-radius:30px}
.tn img{width:62%;height:62%;image-rendering:auto}
.chips{display:flex;gap:14px}
.chips span{font-size:30px;font-weight:700;padding:12px 26px;border-radius:99px;background:rgba(34,211,238,.12);color:#7ee8f7;box-shadow:inset 0 0 0 2px rgba(34,211,238,.35)}
.chips span.o{background:rgba(242,128,30,.14);color:#ffb070;box-shadow:inset 0 0 0 2px rgba(242,128,30,.45)}
.note{display:flex;align-items:center;gap:22px;padding:26px 34px;border-radius:26px;background:rgba(16,21,28,.9);box-shadow:inset 0 0 0 2px rgba(255,255,255,.08),0 30px 60px rgba(0,0,0,.5)}
.note i{width:60px;height:60px;border-radius:50%;background:#22c55e;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:34px;font-weight:800}
.note b{display:block;font-size:34px}.note small{font-size:24px;color:#9aa7b4}
.bars{display:flex;align-items:flex-end;gap:14px;height:220px;padding:0 10px;border-bottom:2px solid rgba(255,255,255,.12)}
.bars i{width:34px;border-radius:8px 8px 0 0;background:linear-gradient(#22D3EE,rgba(242,128,30,.9))}
.hub{display:flex;flex-direction:column;align-items:center}
.avs{display:flex;gap:250px;margin-top:-6px}.avs .av:first-child{margin-left:0}
.av{width:96px;height:96px;border-radius:50%;background:#131a22;box-shadow:inset 0 0 0 3px rgba(242,128,30,.8);display:flex;align-items:center;justify-content:center}
.av span{font-size:30px;font-weight:800;color:#ffb070}
.avs{gap:124px}
.row.sm{gap:18px}.lbl{font-size:30px;font-weight:700;color:#cfd8e1}
.shop{width:640px;border-radius:28px;background:rgba(16,21,28,.92);box-shadow:inset 0 0 0 2px rgba(255,255,255,.08),0 40px 80px rgba(0,0,0,.55);padding:22px}
.shop .bar{display:flex;align-items:center;gap:18px;margin-bottom:22px}
.shop .bar .tn{border-radius:14px}
.shop .bar span:not(.tn){flex:1;height:18px;border-radius:9px;background:rgba(255,255,255,.1)}
.shop .bar span.sm{flex:.35;background:rgba(242,128,30,.6)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid div{border-radius:16px;background:#131a22;padding:10px}
.grid i{display:block;height:110px;border-radius:10px;background:linear-gradient(135deg,rgba(242,128,30,.75),rgba(34,211,238,.6))}
.grid b{display:block;height:12px;width:70%;margin-top:12px;border-radius:6px;background:rgba(255,255,255,.18)}
</style></head><body>
